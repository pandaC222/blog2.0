# 部署时把 __DOMAIN__ 换成真实域名（sed -i 's/__DOMAIN__/example.com/g'）
# 放 /etc/nginx/sites-available/blog，再 ln -s 到 sites-enabled

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # certbot 会把这里改写成 443 + 证书，并加一条 80 跳转

    root /opt/blog/pandaC222.github.io/dist;
    index index.html;

    # 上传目录直接指向源码里的 public/uploads，
    # 这样后台传完图立刻可见，不用等下一次 rebuild
    location /uploads/ {
        alias /opt/blog/pandaC222.github.io/public/uploads/;
        expires 7d;
        access_log off;
    }

    # 后台 SPA（由 Express 的 /admin 静态托管）
    location /admin {
        proxy_pass http://127.0.0.1:3000/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API
    # 注意：Astro 构建时也会在 /api 下产出静态 json（calendar-data / allPostMeta），
    # 所以先找静态文件，找不到才转给后端，否则这些文件会被代理吞掉变 404。
    location /api/ {
        try_files $uri @api_backend;
    }

    location @api_backend {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 重建要跑一两分钟，别让网关先超时
        proxy_read_timeout 300s;
    }

    # 静态站：trailingSlash: "always"，所以 /posts/foo/ 要落到 foo/index.html
    location / {
        try_files $uri $uri/index.html =404;
    }

    # 静态资源长缓存
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /pagefind/ {
        expires 1h;
        access_log off;
    }

    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
