  - title: 堀与宫村
    status: completed
    rating: 9.8
    cover: https://i0.hdslb.com/bfs/bangumi/image/039c4e0b14e27c7a9e5cce2f20a6efd3c8909401.png
    description: |-
      不论是谁，都会有不想被人知道的一面。

      在学校中漂亮大方、成绩优秀的人气女生堀，私下却打扮土气、忙于家务和照顾弟弟。
      在学校中是阴暗宅男形象的宫村，生活中却是打扮时尚、带耳钉的帅气男生。
      因为一次特别的相遇，两人开始有了交集。

      互相拥有对方秘密的两人，感情也在不断发酵。恋爱、友情，充满青春气息的超微碳酸系校园生活就此开始！
