  - title: 龙与虎
    status: completed
    rating: 9.7
    cover: https://i0.hdslb.com/bfs/bangumi/144910805f172d16c5f544f43939a05d8ca20576.jpg
    description: |-
      樱花飞舞的四月，全新的高中二年级，新的班级……
      眼神凶恶的普通男孩——高须龙儿，遇上了众人害怕、凶暴残忍的“掌中老虎”逢坂大河，还知道了她不欲为人知的秘密。这就是龙虎相争爱与战斗的序幕。
      再加上总是笑眯眯的超元气女孩栉枝实乃梨，以及文武双全、勤勉正直，不过却有点奇怪的眼镜班长北村佑作。这群家伙的恋爱怎么会有意想中的那么顺利呢！
      《TIGER×DRAGON！龙与虎》即是一个能带给你关于朋友、恋人和家人间关系启示的校园作品。由《我们俩的田村同学》作者竹宫悠由子以及插画家泰送上的超强恋爱喜剧在此登场。
